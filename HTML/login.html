<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/styles_login.css">
    <title>Inicio de Sesion</title>
</head>
<body class="cuerpo">
    <img id="logo" src="../Icons/logoUaq.png" alt="Logo">
    <article>
        <label id = "titulo">Sistema de gestion de archivos</label>
    </article>
    <article class="articulo">
        <section>
            <section id = "encabezado">
                <label><b>Iniciar Sesion</b></label><br>
                <label> Ingresa tus credenciales</label>
            </section>

            
            <form action="../PHP/login.php" method="POST" autocomplete="off">
                <section>
                    <div id="user">
                        <img id="icon" src="../Icons/user.png">
                        <label class = "etiqueta">Usuario</label>
                    </div>
                    <input name="usuario" placeholder="Usuario" type="text" required>
                </section>

                <section id="password">
                    <div id="user">
                        <img id="icon" src="../Icons/lock.png">
                        <label class = "etiqueta">Contraseña</label>
                    </div>
                    <input name="contrasena" type="password" placeholder="Contraseña" required>
                </section>

                <section>
                    <input id="button" type="submit" value="Iniciar" >
                </section>
                
                <section class="mensaje-error">
                    <section class="mensaje">
                        <p id="texto-error"></p>
                        
                        <button class="btn-cerrar" onclick="cerrarVentana()" type="button">
                            <img class="img-cerrar" src="../Icons/cross.png" alt="Cerrar" width="15"/>
                        </button>
                        <script>
                            const urlParams = new URLSearchParams(window.location.search);
                            const error = urlParams.get('error');
                            const mensajeError = document.querySelector('.mensaje-error');

                            // PASO 2: Lógica modificada
                            if (error) {
                                const pElementoError = document.getElementById('texto-error');
                                
                                pElementoError.textContent = decodeURIComponent(error);

                                mensajeError.classList.add('open');
                            }
                            
                            function cerrarVentana() {
                                mensajeError.classList.remove('open');
                            }
                        </script>
                    </section>
                </section>
            </form> </section>
    </article>
</body>
</html>
