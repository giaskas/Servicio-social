<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Universidad Autonoma de Querétaro</title>
    </head>
    <body>
        <header> 
            <section id="encabezado1">
                <img src="../Icons/logoUaq.png" alt="Logo de la Universidad Autonoma de Querétaro" width="50" height="50">
                <h1>Sistema de Generación de Archivos</h1>
                <h4>Universidad Autonoma de Querétaro</h4>
                <p>Facultad de Ingeniería</p>
                <p>
                     <div id="usuarioAbierto">
                        <span>Juan Pérez</span>
                     </div> 
                     <div id="rolUsuario">
                        <span>Administrador</span>
                     </div>
                     <button id="cerrarSesion">Cerrar Sesión</button>
                </p>
            </section>
            <section id="encabezado2">
                    <button type="button">Subir Archivo</button>
            </section>
            <section id="cuerpoPagina">
                <h2>Historial de Archivos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre del Archivo</th>
                            <th>Fecha de Subida</th>
                            
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="archivos">
                            <td id="nombreArchivo">archivo.pdf</td>
                            <td id="fechaSubida">2024-06-02</td>
                            <td id="acciones">
                                <button>
                                    <img src="../Icons/eye.png" alt="Ver" width="15" height="15">
                                </button>
                                <button>
                                    <img src="../Icons/download.png" alt="Descargar" width="15" height="15">
                                </button>
                            </td>
                        </tr>
                    </tbody>
            </section>
        </header>


    </body>
</html>
